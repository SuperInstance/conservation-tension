[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conservation-tension-engine"
version = "0.2.0"
description = "Pitch-class-aware harmonic tension with Tenney height dissonance, tension gradients, phase-space analysis, and eigenbasis rotation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
